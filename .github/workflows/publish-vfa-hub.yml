name: Build and publish VFA stats hub
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-vfa-hub.yml"
      - "stats.html"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-vfa-hub
  cancel-in-progress: true

jobs:
  build-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Check out live League Hub
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check out Bolt-connected app source
        uses: actions/checkout@v4
        with:
          repository: vfafootball/vfa-league-hub-source
          ref: main
          path: source

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm install --no-audit --no-fund

      - name: Type-check the VFA hub
        working-directory: source
        run: npm run typecheck

      - name: Build the VFA hub
        working-directory: source
        env:
          VITE_SUPABASE_URL: https://ittenygolbahpenghbfi.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_w4J4XmzsLCGT1OAQ5gCD0w_9bg_hckO
        run: npm run build

      - name: Publish the built app under /hub/
        shell: bash
        run: |
          rm -rf hub
          mkdir -p hub
          cp -a source/dist/. hub/
          touch hub/.nojekyll

      - name: Commit built app to the live Pages repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hub
          if git diff --cached --quiet; then
            echo "The live hub already matches the latest source build."
            exit 0
          fi
          git commit -m "Publish latest VFA stats hub build"
          git push origin HEAD:main
